# Config-as-code for the weekly GitHub metadata refresh service.
# Set this file as the service's config path in Railway, with cron "0 6 * * 0".
#
# No build step beyond prisma generate: the job never renders the site, it only
# reads GitHub and writes Postgres, then lets Tier 3 publish the snapshot.
[build]
buildCommand = "npx prisma generate"

[deploy]
startCommand = "npm run db:refresh-github"
