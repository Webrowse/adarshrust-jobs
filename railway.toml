[build]
buildCommand = "npx prisma generate && npm run build"

[deploy]
# The NODE_OPTIONS service variable sets --max-old-space-size=4096, which the
# build genuinely needs (it prerenders ~5,100 repo pages from a 40 MB corpus).
# The running server does not: it starts at ~60 MB heap and its steady working
# set is well under 200 MB. With a 4 GB ceiling V8 has no reason to collect, so
# RSS drifted to 0.82 GB — and Railway bills memory per minute. Capping only the
# server process keeps the build's headroom while forcing normal GC in prod.
# 256, not 512: measured on identical load (homepage + /oss + 300 repo pages),
# 256MB cap settled at 303MB RSS vs 403MB at 512MB and 385MB at 4096MB. Most of
# that difference is uncollected garbage, not retained data - V8 simply collects
# sooner when given less room. Verified safe at 256: 8/8 requests to the 6MB /oss
# page returned 200 with no OOM. Boot is identical either way (212MB RSS,
# 69MB heap), so only the serving working set is being tuned here.
startCommand = "NODE_OPTIONS=--max-old-space-size=256 npm start"
