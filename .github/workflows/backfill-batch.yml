name: backfill-batch

# Weekly enrichment backfill: one Tier 1 batch of 25 repos, writing enrichment
# into Postgres and stopping there. It hardcodes dirty:false, so it never
# publishes and never deploys — whatever it writes reaches the site the next
# time a snapshot is published.
#
# Shares the `pipeline` concurrency group with refresh-github.yml. They also
# share the Postgres run lock, which makes an overlap exit 0 rather than fail,
# but there is no reason to burn a runner finding that out.
on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Run one enrichment backfill batch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Secret names cannot start with GITHUB_, hence the indirection.
          GITHUB_TOKEN: ${{ secrets.GH_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run db:backfill-batch
