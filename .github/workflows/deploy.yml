name: deploy

# Builds the static site and ships it to Cloudflare Pages. This is the only
# thing that publishes osspath.com: a content snapshot lands on main as a
# commit (pressing Refresh in the local admin, or the weekly refresh cron),
# and that push is what makes the site change.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys are atomic on Pages, but two builds racing to publish would still let
# the older one win. One at a time, newest queued last.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The admin routes are typechecked as part of the build even though the
      # export leaves them out, and they import the generated client.
      - run: npx prisma generate

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # Prerendering ~5,600 repo pages from the 24 MB corpus needs the room.
          NODE_OPTIONS: --max-old-space-size=4096
          # Only prebuild's check-schema-sync uses this, to keep failing the
          # deploy on confirmed schema drift. It fails soft if unreachable.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --branch=main --commit-dirty=true
